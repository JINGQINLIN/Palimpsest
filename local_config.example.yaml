# Copy this file to local_config.yaml and fill in real values.
# local_config.yaml is ignored by git.

# Anthropic-compatible endpoint used by the LLM reconstruction passes.
ANTHROPIC_API_KEY: "PUT-YOUR-API-KEY-HERE"
ANTHROPIC_BASE_URL: "https://open.bigmodel.cn/api/anthropic"
RECONSTRUCTION_MODEL: "glm-5.2"

# Fast reconstruction baseline: disable deep thinking to reserve output budget.
THINKING:
  type: disabled

# General pipeline settings.
LLM_TIMEOUT_SECONDS: 600
CONTEXT: ""  # contexts/<name>.yaml — leave empty to disable domain context
OUTPUT_LANGUAGE: "en"  # en | zh — language of model prose (evidence, summaries); code stays English
CODEQL_EXE: "D:\\tools\\codeql\\codeql.exe"

# Used to fetch the raw package from Ghidra (main.py re-fetches on every run).
GHIDRA_INSTALL_DIR: "D:\\path\\to\\ghidra_12.x_PUBLIC"
# Path to pyghidra-mcp executable (in conda env Scripts). If omitted, falls back to "pyghidra-mcp".
PYGHIDRA_MCP_EXE: "D:\\miniconda3\\envs\\semant\\Scripts\\pyghidra-mcp.exe"

# Ablation experiment controls — for academic paper evaluation.
# Set to true to SKIP a stage or DISABLE a feature.
# Default: all false (full pipeline), domain context disabled.
ABLATION:
  skip_structure: false           # skip LLM structure pass
  skip_naming: false              # skip LLM naming pass
  skip_agent_review: false        # enable package-level Agent Review
  skip_codeql_build: false        # skip final CodeQL database creation
  disable_domain_context: true    # disable RAG domain context injection
  disable_pcode: false            # disable P-Code injection in structure prompt
  disable_access_evidence: false  # keep deterministic cross-function access evidence enabled
  enable_prescan: true            # enable Phase 0 Pre-Scan agent before review
  enable_multi_agent: true        # enable Phase 1 multi-agent concurrent review
  reconstruction_workers: 1       # parallel workers per topo layer (1=sequential, 32 for I/O-bound)
